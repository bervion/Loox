<!DOCTYPE html>
<!-- Dev fixture: an account-settings change-password form (current + new +
     confirm). Expected detection: pageType=changePassword; ONLY the new and
     confirm fields are generated-password targets — the current-password
     field must never be written. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Change password fixture</title>
</head>
<body>
  <h1>Account security</h1>
  <form id="change" action="#" method="post">
    <label>Current password
      <input type="password" name="current_password" autocomplete="current-password">
    </label>
    <label>New password
      <input type="password" name="new_password" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_new_password" autocomplete="new-password">
    </label>
    <button type="submit">Update password</button>
  </form>

  <!-- VI keyword-only variant (no autocomplete tokens): tier-4 grouping with
       the current field excluded by its "Mật khẩu hiện tại" label. -->
  <form id="doi-mat-khau" action="#" method="post">
    <label>Mật khẩu hiện tại
      <input type="password" name="mk_hien_tai">
    </label>
    <label>Mật khẩu mới
      <input type="password" name="mk_moi">
    </label>
    <button type="submit">Đổi mật khẩu</button>
  </form>
</body>
</html>
