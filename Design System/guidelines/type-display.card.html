<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 0.5px solid var(--separator); }
  .row:last-child { border-bottom: none; }
  .meta { width: 130px; flex: 0 0 auto; font: var(--weight-medium) 11px var(--font-mono); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="row"><span class="meta">34 / Bold</span><span class="t-large-title" style="color:var(--text-primary)">Vaultify</span></div>
  <div class="row"><span class="meta">28 / Bold</span><span class="t-screen-title" style="color:var(--text-primary)">Kho · Vault</span></div>
  <div class="row"><span class="meta">19 / Semibold</span><span class="t-section" style="color:var(--text-primary)">Watchtower</span></div>
  <div class="row"><span class="meta">17 / Semibold</span><span class="t-headline" style="color:var(--text-primary)">GitHub — octocat@github.com</span></div>
</body>
</html>
