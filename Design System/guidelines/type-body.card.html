<!-- @dsCard group="Type" viewport="700x250" name="Body & supporting" subtitle="SF Pro Text — body, callout, subhead, footnote, caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-base); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 0.5px solid var(--separator); }
  .row:last-child { border-bottom: none; }
  .meta { width: 130px; flex: 0 0 auto; font: var(--weight-medium) 11px var(--font-mono); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="row"><span class="meta">17 / Regular</span><span class="t-body" style="color:var(--text-primary)">Body — main rows and descriptions.</span></div>
  <div class="row"><span class="meta">16 / Regular</span><span class="t-callout" style="color:var(--text-primary)">Callout — secondary row content.</span></div>
  <div class="row"><span class="meta">15 / Regular</span><span class="t-subhead" style="color:var(--text-secondary)">Subhead — supporting detail, min size for real labels.</span></div>
  <div class="row"><span class="meta">13 / Regular</span><span class="t-footnote" style="color:var(--text-secondary)">Footnote — section headers & helper text.</span></div>
  <div class="row"><span class="meta">12 / Medium</span><span class="t-caption" style="color:var(--text-tertiary)">CAPTION — METADATA ONLY</span></div>
</body>
</html>
