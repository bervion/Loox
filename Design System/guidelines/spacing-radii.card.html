<!-- @dsCard group="Spacing" viewport="700x180" name="Corner radii" subtitle="xs 6 · sm 10 · md 14 · lg 20 · xl 28 · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--background-grouped); display: flex; gap: 16px; align-items:center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 84px; background: var(--surface-base); box-shadow: var(--hairline); }
  .lab { font: var(--weight-medium) 11px var(--font-mono); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lab">xs · 6</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lab">sm · 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lab">md · 14</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lab">lg · 20</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lab">xl · 28</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="lab">pill</span></div>
</body>
</html>
