<style>
  html, body { margin:0; }
  body {
    min-height:100vh; padding:40px 28px;
    background:
      radial-gradient(120% 80% at 50% -10%, #ffffff 0%, #e9e9ef 55%, #e2e2e8 100%);
    display:flex; align-items:flex-start; justify-content:center;
    font-family: var(--font-text);
  }
  @keyframes slideIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(40px); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    [style*="animation"] { animation: none !important; }
  }
</style>
