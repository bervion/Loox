<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vaultify — iOS UI kit</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin:0; }
  body {
    min-height:100vh; padding:40px 28px;
    background:
      radial-gradient(120% 80% at 50% -10%, #ffffff 0%, #e9e9ef 55%, #e2e2e8 100%);
    display:flex; align-items:flex-start; justify-content:center;
    font-family: var(--font-text);
  }
  @keyframes slideIn { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(40px); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    [style*="animation"] { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="kit-components.jsx"></script>
<script type="text/babel" src="UnlockScreen.jsx"></script>
<script type="text/babel" src="ItemDetail.jsx"></script>
<script type="text/babel" src="Watchtower.jsx"></script>
<script type="text/babel" src="Appearance.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
