name: Release iOS

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release-ios:
    name: Build & upload to TestFlight
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # The project uses a newer Xcode format (objectVersion 110); select the
      # highest-versioned Xcode on the runner so xcodebuild/gym can open it.
      - name: Select newest Xcode
        run: |
          newest=""; newest_ver=""
          for xc in /Applications/Xcode*.app; do
            [ -d "$xc" ] || continue
            ver=$("$xc/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | awk 'NR==1{print $2}')
            [ -n "$ver" ] || continue
            if [ -z "$newest_ver" ] || [ "$(printf '%s\n%s\n' "$ver" "$newest_ver" | sort -V | tail -1)" = "$ver" ]; then
              newest="$xc"; newest_ver="$ver"
            fi
          done
          echo "Selected Xcode $newest_ver ($newest)"
          echo "DEVELOPER_DIR=$newest/Contents/Developer" >> "$GITHUB_ENV"

      # Version lives in Project.swift (bumped & committed by release.sh before tag).
      - name: Show version
        run: |
          V=$(grep -m1 '"MARKETING_VERSION":' Project.swift | sed -E 's/.*"MARKETING_VERSION": "([^"]+)".*/\1/')
          B=$(grep -m1 '"CURRENT_PROJECT_VERSION":' Project.swift | sed -E 's/.*"CURRENT_PROJECT_VERSION": "([0-9]+)".*/\1/')
          echo "Releasing $V ($B) from ${GITHUB_REF_NAME}"

      # Generate Vaultify.xcworkspace/.xcodeproj using this runner's Xcode.
      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Install gems
        run: bundle install

      - name: Sign & upload to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane build_and_upload
