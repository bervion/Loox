name: Release iOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  CI: '1'
  # The workflow whose green run is the release evidence. A tag ships only if
  # THIS exact commit already has one.
  REQUIRED_WORKFLOW: ci.yml
  # How long to wait for that run to finish. `make release` pushes the commit
  # and the tag together, so this workflow routinely starts while ci.yml is
  # still queued. The unit suite takes about 6 minutes on the self-hosted
  # runner, but a cold GitHub-hosted run can use most of ci.yml's 45-minute
  # timeout plus queue time. 50 minutes covers both; the wait runs on a Linux
  # runner, so the ceiling is cheap, and a genuinely stuck run still ends here.
  RELEASE_EVIDENCE_TIMEOUT_SECONDS: '3000'
  RELEASE_EVIDENCE_POLL_SECONDS: '20'

jobs:
  release-gate:
    name: Tag and CI evidence
    # Same owner condition as the signing job. These checks hold no secrets,
    # and the evidence wait is a polling loop that can last most of a CI run,
    # so they run on Linux: on a macOS runner every idle minute is billed at
    # the macOS rate, and signing never starts unless both pass.
    if: github.actor == 'bervion' && github.triggering_actor == 'bervion'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          fi

      - name: Require a green quality run for this exact commit
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          # A `v*` tag triggers this workflow directly, so without this step a
          # tag can reach signing with zero test evidence. Bind the evidence to
          # the COMMIT, not the branch: a green run on a later main commit says
          # nothing about the tagged tree.
          #
          # This WAITS rather than sampling once. `make release` pushes the
          # release commit and its tag together, so ci.yml and this workflow
          # start within seconds of each other — the first check reliably sees
          # ci.yml still queued, and refusing there rejected a perfectly good
          # release for being early. Waiting is the correct reading of "this
          # commit must have a green run"; sampling once was really asking
          # "…and it must already have finished".
          #
          # It still fails fast on a genuine red: a completed `failure` means
          # re-running is a human decision, not something a release should sit
          # and wait for.
          deadline=$(( SECONDS + RELEASE_EVIDENCE_TIMEOUT_SECONDS ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_API_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$REQUIRED_WORKFLOW/runs?head_sha=$GITHUB_SHA&per_page=100")"

            verdict="$(printf '%s' "$response" \
              | HEAD_SHA="$GITHUB_SHA" WORKFLOW="$REQUIRED_WORKFLOW" ATTEMPT="$attempt" /usr/bin/python3 -c '
          import json, os, sys

          runs = [r for r in json.load(sys.stdin).get("workflow_runs", [])
                  if r.get("head_sha") == os.environ["HEAD_SHA"]]
          workflow = os.environ["WORKFLOW"]

          def state(r):
              return (r.get("status"), r.get("conclusion"))

          if any(state(r) == ("completed", "success") for r in runs):
              run = next(r for r in runs if state(r) == ("completed", "success"))
              print("GREEN %s run %s" % (workflow, run.get("run_number")))
              sys.exit(0)

          if runs and all(r.get("status") == "completed" for r in runs) \
             and any(r.get("conclusion") == "failure" for r in runs):
              print("RED " + " ".join("run %s=%s" % (r.get("run_number"), r.get("conclusion"))
                                      for r in runs))
              sys.exit(0)

          if not runs:
              print("PENDING no %s run exists for this commit yet" % workflow)
          else:
              print("PENDING " + " ".join("run %s=%s/%s" % (r.get("run_number"), r.get("status"),
                                                            r.get("conclusion") or "-")
                                          for r in runs))
          sys.exit(0)
          ')"

            case "$verdict" in
              GREEN*)
                echo "Release evidence: ${verdict#GREEN } succeeded for $GITHUB_SHA"
                exit 0
                ;;
              RED*)
                echo "$REQUIRED_WORKFLOW failed for $GITHUB_SHA — refusing to sign or upload." >&2
                echo "  ${verdict#RED }" >&2
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "Timed out after ${RELEASE_EVIDENCE_TIMEOUT_SECONDS}s waiting for a green $REQUIRED_WORKFLOW run for $GITHUB_SHA." >&2
              echo "  ${verdict#PENDING }" >&2
              echo "  Re-run this job once that run is green; nothing here is signed or uploaded." >&2
              exit 1
            fi

            echo "attempt ${attempt}: ${verdict#PENDING } — waiting ${RELEASE_EVIDENCE_POLL_SECONDS}s"
            sleep "$RELEASE_EVIDENCE_POLL_SECONDS"
          done

  release-ios:
    name: Sign and upload to TestFlight
    needs: release-gate
    # Creating the immutable release tag is the owner approval fallback on
    # plans that do not support protected-environment reviewers. A rerun by a
    # different actor remains blocked as well.
    if: github.actor == 'bervion' && github.triggering_actor == 'bervion'
    environment: production-ios-release
    # TEMPORARY: GitHub-hosted while the self-hosted Mac mini is offline. Restore
    # `[self-hosted, macOS, ARM64, vaultify-release]` when it is back.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select pinned Xcode
        run: scripts/ci/select-xcode.sh

      - name: Install pinned Tuist
        uses: jdx/mise-action@c53b9236f0b3370f31520f8b142f141256d839c6 # v3.6.0

      - name: Show release identity
        run: |
          version=$(grep -m1 '"MARKETING_VERSION":' Project.swift | sed -E 's/.*"MARKETING_VERSION": "([^"]+)".*/\1/')
          number=$(grep -m1 '"CURRENT_PROJECT_VERSION":' Project.swift | sed -E 's/.*"CURRENT_PROJECT_VERSION": "([0-9]+)".*/\1/')
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-beta."*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version" >&2
              exit 1
              ;;
          esac
          echo "Releasing $version ($number) from $GITHUB_REF_NAME"

      - name: Generate project with release configuration
        env:
          TUIST_LOOX_LINK_PROD_TOKEN: ${{ secrets.LOOX_LINK_PROD_TOKEN }}
        run: |
          if [[ -z "$TUIST_LOOX_LINK_PROD_TOKEN" ]]; then
            echo "LOOX_LINK_PROD_TOKEN is not configured" >&2
            exit 1
          fi
          scripts/ci/prepare-project.sh

      - name: Setup managed Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # pinned master, 2026-07-20
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Sign and upload
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_AUTH }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane build_and_upload
