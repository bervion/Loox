name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
    # ready_for_review: draft PRs are skipped, so run once a PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual run gets its own group so it never cancels a push run on main,
  # such as the one a release commit needs as evidence.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  # A few seconds on Linux decide whether the macOS suite is worth its minutes:
  # drafts, documentation-only changes and pushes that merge a PR whose head
  # had the same tree and passed the suite skip it. A skipped "Unit tests" still satisfies a required status check.
  # release-ios.yml accepts only a run whose "Unit tests" job succeeded, and
  # release commits always run it.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Decide whether the unit suite must run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: scripts/ci/plan-unit-tests.sh

  unit-tests:
    name: Unit tests
    needs: plan
    if: needs.plan.outputs.unit == 'true'
    # TEMPORARY: GitHub-hosted while the self-hosted Mac mini is offline. Restore
    # `[self-hosted, macOS, ARM64, vaultify-ci]` when it is back (see the runbook).
    runs-on: macos-26
    # A green hosted run takes about 20 minutes; the ceiling leaves room for a
    # cold package cache while stopping a hung simulator from burning billed
    # macOS minutes for long.
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select pinned Xcode
        run: scripts/ci/select-xcode.sh

      # Boots in the background through toolchain install and project
      # generation, which mostly wait on the network; "Wait for simulator"
      # below blocks until it is up, before compilation starts.
      - name: Create isolated simulator
        env:
          SIMULATOR_BOOT_ASYNC: '1'
        run: scripts/ci/create-simulator.sh

      - name: Install pinned toolchain
        uses: jdx/mise-action@c53b9236f0b3370f31520f8b142f141256d839c6 # v3.6.0

      # Cache immutable dependency sources only. Binary artifacts, workspace
      # state, generated projects and compiled app/test products stay fresh.
      # Exact keys bind sources to the lock and the selected Xcode/toolchain;
      # there is no fallback to a different dependency graph.
      - name: Restore Swift package sources
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/vaultify-spm/repositories
            ${{ runner.temp }}/vaultify-spm/checkouts
          key: swiftpm-source-v1-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.SELECTED_XCODE_VERSION }}-${{ hashFiles('.package.resolved', '.mise.toml', 'scripts/ci/toolchain-pin.sh') }}

      # Tuist.swift passes this directory to Tuist's package resolution, the
      # same one the suite uses, so the graph resolves once per run.
      - name: Generate project
        env:
          TUIST_CI_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/vaultify-spm
        run: scripts/ci/prepare-project.sh

      # Required-reason API declarations. VaultifyCore/** is globbed into four
      # executables, so any shared code that starts touching UserDefaults, file
      # timestamps, disk space or boot time silently widens the required-reason
      # surface of three appexes at once. Cheap to check, and the failure mode
      # is a rejected upload with no build to show for it.
      - name: Check privacy manifests
        run: scripts/ci/check-privacy-manifests.sh

      # A device still settling from its first boot while the suite compiles
      # makes the test app's first launch take minutes on a 3-core runner, so
      # compilation starts only once the boot has finished.
      - name: Wait for simulator
        run: scripts/ci/wait-for-simulator.sh

      - name: Run basic unit suite
        env:
          VAULTIFY_SOURCE_PACKAGES_DIR: ${{ runner.temp }}/vaultify-spm
        run: |
          scripts/ci/run-xcode-suite.sh \
            VaultifyTests \
            "$SIMULATOR_UDID" \
            "$RUNNER_TEMP/vaultify-unit-dd" \
            "$RUNNER_TEMP/unit.xcresult"

      # The receipt is the summary JSON alone. The full xcresult bundle is
      # thousands of files per run and once filled the account-wide artifact
      # quota, which then blocks EVERY upload for up to 12h after cleanup —
      # an infra condition that must never redden a quality run whose tests
      # passed (the release gate reads this job's conclusion, not the
      # artifact). Bundles stay on the runner for forensic pickup.
      - name: Upload machine-readable unit receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit.xcresult.summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Delete isolated simulator
        if: always()
        run: |
          # Persistent-runner hygiene. If the create step died before it could
          # export the UDID, fall back to reclaiming by name in any state —
          # this runner processes one job at a time, so every "Vaultify
          # Quality" device is ours. Whatever slips through both paths is
          # swept by the next create-simulator.sh run.
          set +e
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID"
            xcrun simctl delete "$SIMULATOR_UDID"
          else
            xcrun simctl list devices --json | /usr/bin/python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if device.get("name", "").startswith("Vaultify Quality"):
                      print(device["udid"])
          ' | while read -r udid; do
              xcrun simctl shutdown "$udid"
              xcrun simctl delete "$udid"
            done
          fi
          exit 0
