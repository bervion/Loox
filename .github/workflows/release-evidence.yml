name: Release evidence

on:
  # repository_dispatch always loads this workflow from the default branch.
  # This prevents an owner from accidentally selecting an arbitrary branch's
  # workflow definition for execution on the persistent release runner.
  repository_dispatch:
    types: [vaultify-recovery-rehearsal]

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  recovery-rehearsal:
    name: Recovery rehearsal
    if: github.actor == 'bervion' && github.triggering_actor == 'bervion'
    runs-on: [self-hosted, macOS, ARM64, vaultify-release]
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable previous release tag
        id: validate-previous
        env:
          PREVIOUS_TAG: ${{ github.event.client_payload.previous_tag }}
        run: |
          [[ "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9A-Za-z.-]+)?$ ]] || {
            echo "previous_tag must be an immutable release tag" >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/$PREVIOUS_TAG^{commit}" >/dev/null
          PREVIOUS_SHA="$(git rev-parse "refs/tags/$PREVIOUS_TAG^{commit}")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "candidate must be reachable from origin/main" >&2
            exit 1
          }
          git merge-base --is-ancestor "refs/tags/$PREVIOUS_TAG^{commit}" "$GITHUB_SHA" || {
            echo "previous tag must be an ancestor of the exact candidate" >&2
            exit 1
          }
          if [[ "$PREVIOUS_SHA" == "$GITHUB_SHA" ]]; then
            echo "rollback target must precede the candidate" >&2
            exit 1
          fi
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout rollback target without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.validate-previous.outputs.previous_sha }}
          path: rollback-source
          persist-credentials: false

      - name: Select pinned Xcode
        working-directory: rollback-source
        run: scripts/ci/select-xcode.sh

      - name: Install pinned rollback toolchain
        uses: jdx/mise-action@c53b9236f0b3370f31520f8b142f141256d839c6 # v3.6.0

      - name: Resolve previous source toolchain
        working-directory: rollback-source
        run: mise install

      - name: Rebuild exact candidate without signing
        run: |
          scripts/ci/prepare-project.sh
          xcodebuild \
            -workspace Vaultify.xcworkspace \
            -scheme Vaultify \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/candidate-release-dd" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Derive a higher-build previous-source recovery version
        run: |
          INFO="$RUNNER_TEMP/candidate-release-dd/Build/Products/Release-iphonesimulator/Vaultify.app/Info.plist"
          RECOVERY_MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          CANDIDATE_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          [[ "$RECOVERY_MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          RECOVERY_BUILD_NUMBER="$((CANDIDATE_BUILD_NUMBER + 100000))"
          {
            echo "RECOVERY_MARKETING_VERSION=$RECOVERY_MARKETING_VERSION"
            echo "RECOVERY_BUILD_NUMBER=$RECOVERY_BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      - name: Rebuild previous source as a higher-build fix-forward
        working-directory: rollback-source
        run: |
          scripts/ci/prepare-project.sh
          xcodebuild \
            -workspace Vaultify.xcworkspace \
            -scheme Vaultify \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/rollback-release-dd" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$RECOVERY_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$RECOVERY_BUILD_NUMBER" \
            build

      - name: Create isolated recovery simulator
        run: scripts/ci/create-simulator.sh

      - name: Rehearse candidate to retained-data fix-forward recovery
        run: |
          python3 scripts/quality/emit_ci_gate_receipt.py \
            --kind recovery-rehearsal \
            --tested-sha "$GITHUB_SHA" \
            --previous-tag "${{ github.event.client_payload.previous_tag }}" \
            --rollback-source "$GITHUB_WORKSPACE/rollback-source" \
            --candidate-app-bundle "$RUNNER_TEMP/candidate-release-dd/Build/Products/Release-iphonesimulator/Vaultify.app" \
            --recovery-app-bundle "$RUNNER_TEMP/rollback-release-dd/Build/Products/Release-iphonesimulator/Vaultify.app" \
            --simulator-udid "$SIMULATOR_UDID" \
            --output "$RUNNER_TEMP/recovery-rehearsal.json"

      - name: Destroy isolated recovery simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true

      - name: Upload recovery evidence payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-rehearsal-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-rehearsal.json
          if-no-files-found: error
          retention-days: 30
