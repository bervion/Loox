name: Dev-Quality PR Review

# Copy this file to a target repo at .github/workflows/pr-notify.yml
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   GOCLAW_WEBHOOK_SECRET  = the wh_... bearer secret for the github-pr-review webhook
#   DISCORD_PR_WEBHOOK     = a Discord channel webhook URL for pr-reviews (optional)
# No merge blocking. This only reviews and notifies. You merge.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Ask Rex to review the PR
        id: rex
        env:
          WH: https://goclaw.bervion.com/v1/webhooks/llm
          SECRET: ${{ secrets.GOCLAW_WEBHOOK_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          PROMPT="A pull request needs your review. Repo: ${REPO}. PR #${PR_NUM}: ${TITLE}. URL: ${PR_URL}. Read the diff with 'gh pr diff ${PR_NUM} --repo ${REPO}' and 'gh pr view ${PR_NUM} --repo ${REPO}', evaluate correctness, regressions and UI-UX (use ui-ux-pro-max for UI changes), then give a concise verdict: either 'LGTM' with one line why, or specific non-blocking notes. Do NOT merge. Return only your review text."
          BODY=$(jq -nc --arg p "$PROMPT" '{input:$p, mode:"sync"}')
          RESP=$(curl -sS --max-time 180 -X POST "$WH" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          REVIEW=$(echo "$RESP" | jq -r '.output // .reply // .response // "Rex did not return a review."')
          {
            echo 'review<<REXEOF'
            echo "$REVIEW"
            echo 'REXEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "**Rex (Dev-Quality) review**

          ${{ steps.rex.outputs.review }}

          _Automated, non-blocking. Merge is the owner's call._"

      - name: Notify Discord pr-reviews
        env:
          DISCORD_WH: ${{ secrets.DISCORD_PR_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW: ${{ steps.rex.outputs.review }}
        run: |
          if [ -z "$DISCORD_WH" ]; then echo "no Discord webhook set, skipping"; exit 0; fi
          CONTENT="[PR] ${REPO} #${PR_NUM}: ${TITLE}"$'\n'"${PR_URL}"$'\n\n'"[Rex] ${REVIEW}"
          CONTENT=$(printf '%s' "$CONTENT" | cut -c1-1900)
          jq -nc --arg c "$CONTENT" '{content:$c}' | \
            curl -sS -X POST "$DISCORD_WH" -H "Content-Type: application/json" -d @-

  verify:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Ask Rex to verify the merged fix
        env:
          WH: https://goclaw.bervion.com/v1/webhooks/llm
          SECRET: ${{ secrets.GOCLAW_WEBHOOK_SECRET }}
          DISCORD_WH: ${{ secrets.DISCORD_PR_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          PROMPT="PR #${PR_NUM} in ${REPO} was just MERGED (${TITLE}). Clone or pull the repo into your workspace, verify the change actually resolves its linked issue and nothing obvious regressed. Report pass or fail concisely."
          BODY=$(jq -nc --arg p "$PROMPT" '{input:$p, mode:"sync"}')
          RESP=$(curl -sS --max-time 240 -X POST "$WH" -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" -d "$BODY")
          VERDICT=$(echo "$RESP" | jq -r '.output // .reply // "no verify result"')
          if [ -n "$DISCORD_WH" ]; then
            jq -nc --arg c "[verify] Post-merge #${PR_NUM}: ${VERDICT}" '{content:$c}' | \
              curl -sS -X POST "$DISCORD_WH" -H "Content-Type: application/json" -d @- || true
          fi
          echo "$VERDICT"
