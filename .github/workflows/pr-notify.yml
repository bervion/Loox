name: Dev-Quality PR Policy

# Copy this file to a target repo at .github/workflows/pr-notify.yml
# Optional repo secret: DISCORD_PR_WEBHOOK, a pr-reviews channel webhook URL.
# Automated agent review of untrusted PR content is deliberately disabled until
# GoClaw can prove a server-side read-only capability sandbox and ephemeral workspace.

on:
  pull_request_target:
    # This workflow never checks out or executes the candidate branch. It uses
    # the trusted default-branch workflow for policy and bounded notifications.
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read

jobs:
  trusted-policy:
    name: Trusted PR policy
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Scan untrusted diff with trusted policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          post_status() {
            gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
              -f state="$1" \
              -f context='Trusted PR policy' \
              -f description="$2" \
              -f target_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null
          }

          # pull_request_target jobs are associated with the trusted base ref.
          # Publish a fixed-context commit status on the independently verified
          # PR head so branch protection evaluates the candidate SHA itself.
          post_status pending 'Trusted base policy is scanning this PR head'
          set +e
          (
            set -euo pipefail
            BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $BASIC_AUTH"
            trap 'git config --local --unset-all http.https://github.com/.extraheader || :' EXIT
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
            [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
            git diff --binary --full-index --find-renames "$BASE_SHA" "$HEAD_SHA" -- \
              > "$RUNNER_TEMP/pr.diff"

            OWNER_NAME=${REPO%%/*}
            REPOSITORY_NAME=${REPO#*/}
            # GraphQL variable names below are intentionally literal.
            # shellcheck disable=SC2016
            REVIEW_DATA=$(gh api graphql \
              -F owner="$OWNER_NAME" \
              -F name="$REPOSITORY_NAME" \
              -F number="$PR_NUM" \
              -f query='query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) {
                    reviewDecision
                    reviews(last:100) {
                      totalCount
                      nodes { author { login } state submittedAt commit { oid } }
                    }
                  }
                }
              }')
            REVIEW_TOTAL=$(printf '%s' "$REVIEW_DATA" | jq -r '.data.repository.pullRequest.reviews.totalCount')
            [[ "$REVIEW_TOTAL" -le 100 ]] || { echo 'Too many reviews to authenticate safely' >&2; exit 1; }
            REVIEW_DECISION=$(printf '%s' "$REVIEW_DATA" | jq -r '.data.repository.pullRequest.reviewDecision // "NONE"')
            LATEST_OWNER_REVIEW=$(printf '%s' "$REVIEW_DATA" | jq -r \
              '[.data.repository.pullRequest.reviews.nodes[] |
                select(.author.login == "bervion" and .state != "COMMENTED")] |
                sort_by(.submittedAt) | last // {} | [.state // "NONE", .commit.oid // ""] | @tsv')
            IFS=$'\t' read -r OWNER_REVIEW_STATE OWNER_REVIEW_SHA <<< "$LATEST_OWNER_REVIEW"
            ARGS=(--diff-file "$RUNNER_TEMP/pr.diff")
            if [[ "$REVIEW_DECISION" == "APPROVED" && \
                  "$OWNER_REVIEW_STATE" == "APPROVED" && \
                  "$OWNER_REVIEW_SHA" == "$HEAD_SHA" ]]; then
              ARGS+=(--owner-approved)
            fi
            python3 scripts/quality/check_diff.py "${ARGS[@]}"
          )
          SCAN_STATUS=$?
          set -e
          if [[ "$SCAN_STATUS" -eq 0 ]]; then
            post_status success 'Trusted base policy passed for this PR head'
          else
            post_status failure 'Trusted base policy rejected this PR head'
          fi
          exit "$SCAN_STATUS"

  notify-review-needed:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Discord that bounded review is required
        env:
          DISCORD_WH: ${{ secrets.DISCORD_PR_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DISCORD_WH" ]; then echo "no Discord webhook set, skipping"; exit 0; fi
          CONTENT="[PR review required] ${REPO} #${PR_NUM}: ${TITLE}"$'\n'"${PR_URL}"$'\n\n'"Run Rex only through the owner-started bounded verification lane; untrusted PRs are not sent to a tool-capable agent automatically."
          CONTENT=$(printf '%s' "$CONTENT" | cut -c1-1900)
          jq -nc --arg c "$CONTENT" '{content:$c,allowed_mentions:{parse:[]}}' | \
            curl -sS -X POST "$DISCORD_WH" -H "Content-Type: application/json" -d @-

  notify-merged:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Discord that post-merge verification is required
        env:
          DISCORD_WH: ${{ secrets.DISCORD_PR_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$DISCORD_WH" ]; then echo "no Discord webhook set, skipping"; exit 0; fi
          CONTENT="[post-merge verification required] ${REPO} #${PR_NUM}: ${TITLE}"$'\n'"${PR_URL}"
          CONTENT=$(printf '%s' "$CONTENT" | cut -c1-1900)
          jq -nc --arg c "$CONTENT" '{content:$c,allowed_mentions:{parse:[]}}' | \
            curl -sS -X POST "$DISCORD_WH" -H "Content-Type: application/json" -d @-
